<div class="portfolio">
  <app-activity-bar
    [selectedSection]="selectedSection"
    (sectionSelected)="selectSection($event)">
  </app-activity-bar>

  <app-explorer
    [selectedSection]="selectedSection"
    (fileSelected)="selectedFile = $event">
  </app-explorer>

  <app-editor
    [selectedFile]="selectedFile"
    (fileSelected)="selectedFile = $event">
  </app-editor>   
</div>
